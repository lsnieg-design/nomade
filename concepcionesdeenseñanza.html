<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concepciones de Enseñanza - Cuestionario Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: #F5F5DC;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(245, 245, 220, 0.3);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #F5F5DC;
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        .content {
            padding: 40px;
        }

        /* Estilos Registro Inicial */
        .login-box {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
            font-size: 1em;
        }
        
        .question-card {
            background: #FAEBD7;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #722F37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        
        .question-number {
            color: #722F37;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        .scenario {
            font-size: 1.1em;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #2d3748;
            background: #F5F5DC;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
        }
        
        .options {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option {
            background: #F5F5DC;
            border: 2px solid #D2B48C;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .option:hover {
            border-color: #722F37;
            background: #FAEBD7;
            transform: translateY(-2px);
        }
        
        .option.selected {
            border-color: #722F37;
            background: #FAEBD7;
        }
        
        .option.correct {
            border-color: #8B4513;
            background: #DEB887;
        }
        
        .option.incorrect {
            border-color: #A0522D;
            background: #F4A460;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1em;
            line-height: 1.6;
            display: none;
        }
        
        .feedback.correct {
            background: #DEB887;
            border: 1px solid #8B4513;
            color: #2d3748;
        }
        
        .feedback.incorrect {
            background: #F4A460;
            border: 1px solid #A0522D;
            color: #2d3748;
        }
        
        .btn {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(114, 47, 55, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        
        .score {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
        }
        
        .hidden {
            display: none;
        }
        
        .final-score {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="container" id="login-container">
        <div class="header">
            <h1>Bienvenido/a</h1>
            <p>Ingresa tus datos para registrar tu participación</p>
        </div>
        <div class="content login-box">
            <input type="text" id="nombreInput" placeholder="Nombre" required>
            <input type="text" id="apellidoInput" placeholder="Apellido" required>
            <button class="btn" onclick="iniciarCuestionario()">Comenzar Juego</button>
        </div>
    </div>

    <div class="container hidden" id="game-container">
        <div class="header">
            <h1>Concepciones de Enseñanza</h1>
            <p>Identifica qué concepción se refleja en cada escena</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="content" id="content"></div>
        
        <div class="navigation">
            <div class="score" id="score">Pregunta 1 de 10</div>
            <div>
                <button class="btn" id="prevBtn" onclick="previousQuestion()" disabled>Anterior</button>
                <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Siguiente</button>
            </div>
        </div>
    </div>

    <script>
        // URL de tu Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOxQiuPIwXQ2a6vfQaM0ttLQwFUsm2eV4gohoR0b0k2-cMEsjjglyGZyPGd222mAda/exec";

        const questions = [
            {
                scenario: "Durante la clase de Historia, la profesora María explica detalladamente los eventos de la Revolución Francesa. Los estudiantes permanecen en silencio, tomando apuntes mientras ella presenta una secuencia cronológica de hechos. Al final, asigna páginas del libro para memorizar fechas y nombres importantes para el examen de la próxima semana.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Exacto! Has identificado perfectamente esta concepción. En esta escena observamos los elementos clásicos de la enseñanza como transmisión.",
                incorrectFeedback: "Te invito a reflexionar un poco más... ¿Notaste cómo los estudiantes se mantienen en silencio?"
            },
            {
                scenario: "En la clase de Ciencias Naturales, el profesor Carlos presenta a los estudiantes el siguiente desafío: 'Imaginen que son científicos y deben investigar por qué las plantas de nuestro jardín escolar se están marchitando.'",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien! Identificaste correctamente la construcción activa del aprendizaje.",
                incorrectFeedback: "Observa más detenidamente el rol de los estudiantes..."
            },
            {
                scenario: "La profesora Ana está enseñando matemáticas y dice: 'Hoy aprenderán la fórmula para calcular el área del triángulo. Es base por altura dividido dos. Ahora copien esta fórmula...'",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto! Esta es una escena típica de transmisión de conocimientos.",
                incorrectFeedback: "Piensa en cómo se presenta el conocimiento aquí..."
            },
            {
                scenario: "En una clase de Lengua, los estudiantes de 5° grado están trabajando en un proyecto: crear una revista escolar sobre su comunidad. Deben investigar, entrevistar vecinos, escribir artículos...",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente! Has reconocido el enfoque de desarrollo de competencias.",
                incorrectFeedback: "Fíjate bien en todo lo que están aprendiendo los estudiantes..."
            },
            {
                scenario: "Durante una clase de Filosofía, el profesor presenta la pregunta: '¿Qué es la justicia?' En lugar de dar una definición, invita a los estudiantes a compartir sus ideas previas.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien! Esta es construcción activa del aprendizaje en su máxima expresión.",
                incorrectFeedback: "Observa cómo se construye el conocimiento aquí..."
            },
            {
                scenario: "En la clase de Química, la profesora proyecta diapositivas con las propiedades de los elementos químicos. Dicta definiciones que los estudiantes copian textualmente.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto! Esta escena ilustra perfectamente la enseñanza como transmisión de conocimientos.",
                incorrectFeedback: "Reflexiona sobre la dinámica de esta clase..."
            },
            {
                scenario: "Los estudiantes de 3° grado están aprendiendo sobre el ciclo del agua. La maestra los lleva al patio y les propone: 'Observen qué pasa cuando riego las plantas en este día soleado.'",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Perfecto! Has identificado la construcción activa del aprendizaje.",
                incorrectFeedback: "Piensa en cómo aprenden los niños en esta situación..."
            },
            {
                scenario: "En un curso de Emprendimiento, los estudiantes deben crear un plan de negocio real para resolver un problema de su comunidad. Trabajan en equipos multidisciplinarios...",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente! Esta es una perfecta ilustración del desarrollo de competencias.",
                incorrectFeedback: "Observa todo lo que están aprendiendo estos estudiantes..."
            },
            {
                scenario: "En Educación Física, el profesor explica las reglas del básquetbol usando un diagrama en el pizarrón. Los estudiantes escuchan atentamente mientras él describe cada posición...",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Así es! Aunque pueda parecer sorprendente, esta escena refleja la transmisión de conocimientos.",
                incorrectFeedback: "¿Te resulta extraño pensar en transmisión aquí? Mira la metodología."
            },
            {
                scenario: "En una clase de Arte, los estudiantes están explorando el tema 'Identidad cultural'. Cada estudiante investiga sus raíces familiares y experimenta con técnicas artísticas...",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien! Esta es construcción activa en su forma más personalizada.",
                incorrectFeedback: "Reflexiona sobre cómo se desarrolla el aprendizaje aquí."
            }
        ];

        let currentQuestion = 0;
        let selectedOption = null;
        let answered = false;
        let correctAnswers = 0;
        let userData = { nombre: "", apellido: "" };

        function iniciarCuestionario() {
            const n = document.getElementById('nombreInput').value.trim();
            const a = document.getElementById('apellidoInput').value.trim();
            
            if (n === "" || a === "") {
                alert("Por favor, completa nombre y apellido para comenzar.");
                return;
            }
            
            userData.nombre = n;
            userData.apellido = a;
            
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const question = questions[currentQuestion];
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Pregunta ${currentQuestion + 1} de ${questions.length}</div>
                    <div class="scenario">${question.scenario}</div>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})" id="option${index}">
                                ${option}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <button class="btn" onclick="checkAnswer()" id="checkBtn" disabled>Verificar respuesta</button>
                </div>
            `;
            
            updateProgress();
            updateNavigation();
            selectedOption = null;
            answered = false;
        }

        function selectOption(optionIndex) {
            if (answered) return;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById(`option${optionIndex}`).classList.add('selected');
            selectedOption = optionIndex;
            document.getElementById('checkBtn').disabled = false;
        }

        function checkAnswer() {
            if (selectedOption === null || answered) return;
            
            const question = questions[currentQuestion];
            const feedback = document.getElementById('feedback');
            const checkBtn = document.getElementById('checkBtn');
            const options = document.querySelectorAll('.option');
            
            answered = true;
            checkBtn.style.display = 'none';
            
            if (selectedOption === question.correct) {
                correctAnswers++;
                options[selectedOption].classList.add('correct');
                feedback.className = 'feedback correct';
                feedback.innerHTML = question.correctFeedback;
            } else {
                options[selectedOption].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = question.incorrectFeedback;
            }
            
            feedback.style.display = 'block';
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showFinalResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('score').textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
        }

        function updateNavigation() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = true;
        }

        function showFinalResults() {
            const percentage = Math.round((correctAnswers / questions.length) * 100);
            
            document.getElementById('content').innerHTML = `
                <div class="final-score">
                    <h2>¡Finalizado, ${userData.nombre}!</h2>
                    <p>Respuestas correctas: <strong>${correctAnswers} de ${questions.length}</strong></p>
                    <p>Porcentaje: <strong>${percentage}%</strong></p>
                    <p>Tus resultados han sido registrados con éxito.</p>
                    <button class="btn" onclick="location.reload()">Reiniciar</button>
                </div>
            `;
            
            document.querySelector('.navigation').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';

            // ENVÍO AUTOMÁTICO A GOOGLE SHEETS
            enviarDatos();
        }

        function enviarDatos() {
            const payload = {
                fecha: new Date().toLocaleString(),
                nombre: userData.nombre,
                apellido: userData.apellido,
                puntaje: correctAnswers,
                total: questions.length
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        }
    </script>
</body>
</html>
