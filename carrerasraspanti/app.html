<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

button{cursor:pointer}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}

.subtitle{color:var(--gris);margin-top:6px}
.source{font-size:12px;color:var(--gris);text-align:right;max-width:380px}
.toolbar,.filters{background:var(--blanco);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}

.field{min-width:180px}.field.small{min-width:130px}.field.grow{flex:1}
label{display:block;font-size:11px;font-weight:700;color:var(--gris);margin-bottom:5px}

</head>

const allNuclei = arr => [...new Set(arr.flatMap(m=>m.nucleos||[]).map(x=>x.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
const notes = () => {try{return JSON.parse(localStorage.getItem(NOTES_KEY)||"{}")}catch{return {}}};
const saveNote = (id,v) => {const n=notes(); n[id]=v; localStorage.setItem(NOTES_KEY,JSON.stringify(n));};

function showView(name){
  views.forEach(v=>$("#"+v).classList.toggle("active",v===name));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
  render();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
$("#yearFilter").onchange=e=>{state.year=e.target.value;render()};
$("#periodFilter").onchange=e=>{state.period=e.target.value;render()};
$("#search").oninput=e=>{state.search=e.target.value;render()};
$("#clear").onclick=()=>{state.year="";state.period="";state.search="";$("#yearFilter").value="";$("#periodFilter").value="";$("#search").value="";render()};

function openSubject(id){
  const m=MATERIAS.find(x=>x.id===id); if(!m)return;
  $("#modal").innerHTML=`
    <div class="modal-top"><div><div class="eyebrow">${esc(m.campoFuente)}</div><h2 style="color:var(--bordo);margin:3px 0">${esc(m.materia)}</h2>
    <div class="small">${m.ano}.º año · ${periodLabel(m.periodo)} · ${m.horas} horas · ${esc(m.docente||"Docente no consignado")}</div></div>
    <button class="close" onclick="closeModal()">×</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
    <h3>Unidades / contenidos del programa</h3>
    ${m.unidades.length?m.unidades.map(u=>`<div class="alert info">${esc(u)}</div>`).join(""):`<div class="empty">No hay unidades detalladas en el resumen cargado.</div>`}
    <h3>Núcleos temáticos</h3>
    <div class="chips">${m.nucleos.length?m.nucleos.map(n=>`<span class="chip">${esc(n)}</span>`).join(""):"<span class='small'>No consignados</span>"}</div>
    <h3>Referencia al Diseño Curricular</h3>
    <p class="small">${esc(m.disenoResumen||"Sin referencia consignada en el resumen.")}</p>
    <h3>Contenidos faltantes / observaciones de la fuente</h3>
    <p class="small">${esc(m.faltantes||"Sin observaciones.")}</p>
    ${m.revisionFuente?`<div class="alert">⚠ ${esc(m.revisionFuente)}</div>`:""}
    <h3>Nota del equipo directivo</h3>
    <textarea class="note" id="subjectNote" placeholder="Registrar una observación institucional...">${esc(notes()[m.id]||"")}</textarea>
    <div class="actions" style="margin-top:10px"><button class="btn" onclick="saveCurrentNote('${m.id}')">Guardar nota</button></div>`;
  $("#detail").classList.add("open");
}
function saveCurrentNote(id){saveNote(id,$("#subjectNote").value);closeModal();render()}
function closeModal(){$("#detail").classList.remove("open")}
$("#detail").onclick=e=>{if(e.target.id==="detail")closeModal()};

function kpis(data){
  const fields=new Set(data.map(m=>m.campoFuente));
  const topics=allNuclei(data);
  return `<div class="grid4">
    <div class="kpi"><div class="n">${data.length}</div><div class="l">espacios curriculares cargados</div></div>
    <div class="kpi"><div class="n">${[...new Set(data.map(m=>m.ano))].length}</div><div class="l">años disponibles</div></div>
    <div class="kpi"><div class="n">${fields.size}</div><div class="l">categorías de campo en la fuente</div></div>
    <div class="kpi"><div class="n">${topics.length}</div><div class="l">núcleos temáticos registrados</div></div>
  </div>`;
}

function renderInicio(){
  const d=filtered();
  const dup = Object.entries(d.reduce((a,m)=>{const k=m.ano+"|"+m.materia.toLowerCase();(a[k]??=[]).push(m);return a},{})).filter(([,v])=>v.length>1);
  const noProg=d.filter(m=>!m.unidades.length).length;
  $("#inicio").innerHTML=`
    ${kpis(d)}
    <div class="two">
      <div class="section"><h2>Lectura rápida</h2><p class="head">Lo que el mapa permite mirar con la información cargada hasta ahora.</p>
        ${dup.length?`<div class="alert">⚠ Se detectó al menos un posible duplicado en la fuente de datos.</div>`:"<div class='alert ok'>No se detectaron duplicados en el filtro actual.</div>"}
        ${noProg?`<div class="alert">Hay ${noProg} espacios sin unidades detalladas en el resumen de programas. No conviene interpretar ausencia de datos como ausencia de contenidos.</div>`:"<div class='alert ok'>Todos los espacios filtrados tienen unidades detalladas.</div>"}
        <div class="alert info">La app separa los datos del resumen institucional de la lectura del Diseño Curricular, para no mezclar categorías que no son idénticas.</div>
      </div>
      <div class="section"><h2>Preguntas directivas</h2><p class="head">Entradas rápidas al análisis.</p>
        <div class="actions">
          <button class="btn" onclick="showView('trayectoria')">¿Cómo está organizada la carrera?</button>
          <button class="btn alt" onclick="showView('momento')">¿Qué pasa en un momento formativo?</button>
          <button class="btn alt" onclick="showView('tematicas')">¿Qué temas se repiten?</button>
          <button class="btn alt" onclick="showView('revision')">¿Qué requiere revisión?</button>
        </div>
      </div>
    </div>
    <div class="section"><h2>Base documental</h2><p class="head">La Resolución 1009/09 establece que el Profesorado de Educación Especial tiene 1.º y 2.º año comunes a las distintas orientaciones; el mapa usa esos dos años como base inicial. La fuente institucional agrega el detalle de programas, docentes, períodos y observaciones.</p>
      <div class="small">Fuente normativa: Diseño Curricular del Profesorado de Educación Especial, Res. 1009/09, apartado 3/1. Fuente de programas: resúmenes institucionales cargados en esta V1.</div>
    </div>`;
}

function subjectCard(m){
 return `<div class="subject" onclick="openSubject('${m.id}')"><div class="name">${esc(m.materia)}</div>
 <div class="meta">${esc(m.campoFuente)} · ${periodLabel(m.periodo)} · ${m.horas} h</div>
 <div class="chips" style="margin-top:5px">${(m.nucleos||[]).slice(0,5).map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div></div>`;
}

function renderTrayectoria(){
  const d=filtered();
  const years=[1,2].filter(y=>!state.year||String(y)===state.year);
  $("#trayectoria").innerHTML=`<div class="section"><h2>Trayectoria curricular</h2><p class="head">Lectura cronológica de los espacios curriculares. Hacé clic en una materia para abrir su ficha de análisis.</p>
  <div class="timeline">${years.map(y=>{
    const yd=d.filter(m=>m.ano===y);
    return `<div class="year"><h3>${y}.º año <span class="small">· ${yd.length} espacios</span></h3>
      ${["1C","2C","ANUAL"].map(p=>{const arr=yd.filter(m=>m.periodo===p);return `<div class="period"><div class="period-title">${periodLabel(p)} ${p==="ANUAL"?"(atraviesa ambos cuatrimestres)":""}</div><div class="subjects">${arr.length?arr.map(subjectCard).join(""):"<div class='small'>Sin espacios consignados para este período.</div>"}</div></div>`}).join("")}
    </div>`}).join("")}</div></div>`;
}

function renderMomento(){
  const d=filtered();
  const groups={};
  d.forEach(m=>{const key=m.ano+"|"+m.periodo;(groups[key]??=[]).push(m)});
  const keys=Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  $("#momento").innerHTML=`<div class="section"><h2>Momentos formativos</h2><p class="head">La pregunta es qué conjunto de saberes aparece simultáneamente en un mismo momento curricular.</p>
  ${keys.length?keys.map(k=>{
    const [y,p]=k.split("|"), arr=groups[k], ns=allNuclei(arr);
    return `<div class="section" style="box-shadow:none;background:#fffaf3"><h2>${y}.º año · ${periodLabel(p)} <span class="small">· ${arr.length} espacios · ${arr.reduce((s,m)=>s+m.horas,0)} h consignadas</span></h2>
      <div class="chips" style="margin-bottom:10px">${ns.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>
      <div class="subjects">${arr.map(subjectCard).join("")}</div></div>`;
  }).join(""):"<div class='empty'>Elegí un año/período o quitá los filtros.</div>"}</div>`;
}

function renderCampos(){
  const d=filtered(), map={};
  d.forEach(m=>(map[m.campoFuente]??=[]).push(m));
  const max=Math.max(1,...Object.values(map).map(v=>v.length));
  $("#campos").innerHTML=`<div class="section"><h2>Distribución por campos / categorías de la fuente</h2><p class="head">Esta vista conserva literalmente las categorías del resumen institucional. No las reemplaza automáticamente por las categorías del Diseño Curricular.</p>
  ${Object.entries(map).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`<div class="barrow"><div>${esc(k)}</div><div class="bar"><i style="width:${v.length/max*100}%"></i></div><strong>${v.length}</strong></div>`).join("")}
  <div class="alert info">Para la siguiente versión podemos agregar una segunda capa: <b>Campo según Diseño Curricular Res. 1009/09</b>, manteniendo separado el campo utilizado en los programas institucionales.</div></div>`;
}

function renderTematicas(){
  const d=filtered(), map={};
  d.forEach(m=>(m.nucleos||[]).forEach(n=>(map[n]??=[]).push(m)));
  const rows=Object.entries(map).sort((a,b)=>b[1].length-a[1].length);
  $("#tematicas").innerHTML=`<div class="section"><h2>Mapa de temáticas</h2><p class="head">Acá aparecen únicamente los núcleos temáticos explícitos en los resúmenes. La repetición no se interpreta automáticamente como problema: primero se muestra el recorrido para que el equipo lo analice.</p>
  <table class="table"><thead><tr><th>Temática</th><th>Espacios</th><th>Años</th><th>Dónde aparece</th></tr></thead><tbody>
  ${rows.map(([n,ms])=>`<tr><td><b>${esc(n)}</b></td><td>${ms.length}</td><td>${[...new Set(ms.map(m=>m.ano))].sort().join(", ")}</td><td>${ms.map(m=>`<button class="btn alt" style="padding:4px 7px;margin:2px" onclick="openSubject('${m.id}')">${esc(m.materia)}</button>`).join("")}</td></tr>`).join("")}</tbody></table>
  </div>`;
}

function renderCruces(){
  const d=filtered(), pairs=[];
  for(let i=0;i<d.length;i++)for(let j=i+1;j<d.length;j++){
    const A=new Set(d[i].nucleos), common=d[j].nucleos.filter(x=>A.has(x));
    if(common.length>=2) pairs.push({a:d[i],b:d[j],common});
  }
  pairs.sort((a,b)=>b.common.length-a.common.length);
  const counts={}; d.forEach(m=>(m.nucleos||[]).forEach(n=>counts[n]=(counts[n]||0)+1));
  const repeated=Object.entries(counts).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]);
  $("#cruces").innerHTML=`<div class="two">
    <div class="section"><h2>Temáticas compartidas</h2><p class="head">Núcleos que aparecen en más de un espacio.</p>
      ${repeated.length?repeated.map(([n,c])=>`<div class="alert info"><b>${esc(n)}</b> aparece en ${c} espacios.</div>`).join(""):"<div class='empty'>No hay repeticiones en el filtro actual.</div>"}
    </div>
    <div class="section"><h2>Posibles cruces fuertes</h2><p class="head">Pares que comparten al menos dos núcleos explícitos.</p>
      ${pairs.length?pairs.map(p=>`<div class="alert"><b>${esc(p.a.materia)}</b> ↔ <b>${esc(p.b.materia)}</b><br><span class="small">${p.common.map(esc).join(" · ")}</span></div>`).join(""):"<div class='empty'>No aparecen pares con dos o más núcleos compartidos.</div>"}
    </div></div>`;
}

function renderRevision(){
  const d=filtered(), dup=[];
  const by={}; d.forEach(m=>{const k=m.ano+"|"+m.materia.toLowerCase();(by[k]??=[]).push(m)});
  Object.values(by).forEach(v=>{if(v.length>1)dup.push(v)});
  const missing=d.filter(m=>!m.unidades.length);
  const notes=Object.entries(notes()).filter(([id,v])=>v);
  $("#revision").innerHTML=`<div class="section"><h2>Revisión institucional</h2><p class="head">No son diagnósticos automáticos. Son señales para que el equipo directivo decida qué quiere revisar.</p>
    ${dup.length?dup.map(v=>`<div class="alert"><b>Posible duplicado:</b> ${esc(v[0].materia)} en ${v[0].ano}.º año. La fuente contiene más de un registro.</div>`).join(""):"<div class='alert ok'>No se detectaron duplicados con el filtro actual.</div>"}
    ${missing.length?`<div class="alert"><b>Información incompleta:</b> ${missing.length} espacios no tienen unidades detalladas en el resumen. Esto debe leerse como falta de información, no como ausencia de contenidos.</div>`:"<div class='alert ok'>Todos los espacios filtrados tienen unidades detalladas.</div>"}
    <h3>Observaciones del equipo</h3>
    ${notes.length?notes.map(([id,v])=>{const m=MATERIAS.find(x=>x.id===id);return `<div class="alert info"><b>${esc(m?.materia||id)}</b><br>${esc(v)}</div>`}).join(""):"<div class='small'>Todavía no hay notas institucionales guardadas.</div>"}
  </div>
  <div class="section"><h2>Próxima capa de análisis</h2><p class="head">Cuando carguemos más años, esta misma estructura podrá detectar progresiones, concentraciones, vacíos entre años, articulaciones y cuellos de botella sin cambiar la base de la aplicación.</p></div>`;
}

function render(){
  renderInicio();renderTrayectoria();renderMomento();renderCampos();renderTematicas();renderCruces();renderRevision();
}
render();
</script>
</body>
</html>
