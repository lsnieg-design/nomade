<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Propuesta Experiencial | LucyReact</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        :root {
            --blanco: #FFFFFF; --gris: #F8F9FA; --azul: #A2D9FF; 
            --rosa: #FFC4D6; --verde: #B2F2BB; --lila: #DCC6FF; 
            --amarillo: #FFF3BF; --texto: #2D3436;
        }

        body { font-family: 'Outfit', sans-serif; background: var(--gris); color: var(--texto); margin: 0; padding: 0; }
        
        /* Layout principal */
        .header { text-align: center; padding: 60px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1100px; margin: 0 auto 60px; padding: 20px; }
        
        .card { height: 280px; border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.4s ease; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-15px); }

        /* Estructura del Contenido */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--blanco); z-index: 1000; overflow-y: auto; padding: 40px; }
        .container-box { max-width: 800px; margin: auto; }
        
        .panel { background: #fdfdfd; border: 2px solid #eee; border-radius: 30px; padding: 30px; margin: 20px 0; }
        h2 { font-size: 2.5rem; margin-bottom: 10px; }
        h3 { color: #636e72; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>Propuesta Experiencial</h1>
    <p>Áreas del desarrollo, funciones ejecutivas y comunicación</p>
</div>

<div class="grid" id="mainGrid">
    <div class="card" style="background:var(--azul)" onclick="abrirExp(0)"><i data-lucide="message-square" size="64"></i><h3>Comunicación</h3></div>
    <div class="card" style="background:var(--rosa)" onclick="abrirExp(1)"><i data-lucide="brain" size="64"></i><h3>Memoria</h3></div>
    <div class="card" style="background:var(--green)" onclick="abrirExp(2)"><i data-lucide="puzzle" size="64"></i><h3>Ejecutivas</h3></div>
    <div class="card" style="background:var(--lila)" onclick="abrirExp(3)"><i data-lucide="search" size="64"></i><h3>Cognitiva</h3></div>
    <div class="card" style="background:var(--amarillo)" onclick="abrirExp(4)"><i data-lucide="hand" size="64"></i><h3>Psicomotora</h3></div>
</div>

<div id="modal" class="modal">
    <button onclick="document.getElementById('modal').style.display='none'" style="float:right; border:none; background:none; font-size: 2rem; cursor:pointer;">&times;</button>
    <div class="container-box" id="contenidoDetalle"></div>
</div>

<script>
const baseDatos = [
    { 
        titulo: "🗣️ Estación 1: Comunicación y Lenguaje",
        actividades: "1. Armar avión de papel usando solo gestos, dibujos o sílabas sin sentido.<br>2. Explicar cómo atarse los cordones sin palabras ni señas obvias.<br>3. Pedir una goma de borrar sin hablar, sin señalar ni escribir.",
        reflexion: "¿Qué pasó cuando no podías usar las palabras? ¿Qué sentiste cuando no entendías qué quería decir tu compañera?",
        explicacion: "Las personas con DI muchas veces entienden mejor con apoyos visuales, gestos, pictogramas o lenguaje simple. Otras veces, pueden no encontrar las palabras para expresarse. Por eso es clave acompañarlas con paciencia, estrategias visuales y sin subestimarlas.",
        teoria: "El lenguaje expresivo es la capacidad de comunicar pensamientos. El lenguaje comprensivo es la capacidad de entender lo que los demás dicen. En personas con DI, estas funciones pueden estar afectadas, lo que no implica falta de ideas, sino dificultad en el canal de expresión o comprensión."
    },
    {
        titulo: "🧠 Estación 2: Memoria de Trabajo",
        actividades: "1. Tocar una pared, saltar 2 veces, girar, aplaudir 3 veces, cruzar brazos, sentarse, cerrar los ojos, abrir la boca y bostezar.<br>2. Caminar a la puerta, decir el nombre al revés, levantar un objeto, tocar la cabeza, cantar algo inventado, volver en puntas de pie y sentarse.<br>3. Tocar 3 bancos, gritar una fruta, pasar bajo una mesa, imitar un animal, buscar algo rojo, chocar los cinco y hacerte la dormida.",
        reflexion: "¿Pudiste recordar todos los pasos? ¿Qué pasó cuando alguien te interrumpía en medio de la secuencia?",
        explicacion: "La memoria de trabajo limitada hace que muchas instrucciones parezcan “imposibles”. Es vital dividir las consignas en pasos simples, usar apoyos visuales y verificar la comprensión antes de seguir.",
        teoria: "La memoria de trabajo es la capacidad del cerebro para retener y manipular información durante unos segundos para resolver una tarea. Es clave para seguir instrucciones complejas. En la DI, la dificultad suele ser el procesamiento de información verbal larga."
    },
    {
        titulo: "🧩 Estación 3: Funciones Ejecutivas",
        actividades: "1. Armar una torre con los elementos de las mochilas con una mano, sin repetir colores y sin hablar.<br>2. Clasificar objetos sin saber la categoría mientras se interrumpe la tarea.<br>3. Seguir una secuencia de acciones que se invierte o cambia a mitad de camino.",
        reflexion: "¿Te frustraste cuando cambiaban las reglas del juego? ¿Pudiste seguir pensando con tantas interrupciones?",
        explicacion: "Las personas con DI pueden necesitar ayuda para comenzar, sostener, terminar o reorganizarse si hay un cambio. Dar modelos visuales y anticipar cambios es la estrategia principal.",
        teoria: "Las funciones ejecutivas son procesos mentales que nos permiten: planificar, inhibir impulsos, adaptarse a cambios y mantener la atención. En la DI, suelen estar inmaduras, llevando a desorientación o frustración al organizar tareas."
    },
    {
        titulo: "🔍 Estación 4: Área Cognitiva",
        actividades: "1. Ordenar una historia con imágenes ambiguas, sin texto.<br>2. Resolver enigmas con información incompleta o confusa.<br>3. Buscar relación entre palabras sin conexión evidente (ej: zapato y cielo).",
        reflexion: "¿Pudiste entender qué pasaba en las imágenes sin texto? ¿Cómo fue tratar de pensar 'sin pistas'?",
        explicacion: "Las personas con DI suelen necesitar instrucciones paso a paso, situaciones claras y tangibles. La frustración no surge por falta de capacidad, sino por falta de accesibilidad en la información.",
        teoria: "El razonamiento lógico organiza información y saca conclusiones. La comprensión abstracta (dobles sentidos, metáforas) es compleja para personas con pensamiento concreto, por lo cual se prefieren ejemplos reales y visuales."
    },
    {
        titulo: "🤲 Estación 5: Área Psicomotora",
        actividades: "1. Atarse los cordones de las zapatillas con las manos atadas.<br>2. Recortar figuras exactas solo usando los dedos índices.<br>3. Hacer un avión de papel usando 3 dedos de cada mano.",
        reflexion: "¿Te costó hacer algo que normalmente es fácil? ¿Qué pasó cuando tus manos no respondían como querías?",
        explicacion: "Una tarea simple es una gran barrera si hay un problema motor. Adaptar materiales (tijeras especiales, lápices gruesos) y dar más tiempo permite una participación plena.",
        teoria: "La motricidad fina implica precisión (manos/dedos); la gruesa, movimientos amplios (caminar/equilibrio). La coordinación ojo-mano es fundamental. En la DI, las dificultades motrices asociadas suelen limitar la autonomía escolar."
    }
];

function abrirExp(i) {
    const d = baseDatos[i];
    document.getElementById('contenidoDetalle').innerHTML = `
        <h2>${d.titulo}</h2>
        <div class="panel"><h3>🔹 Desafíos y Actividades</h3><p>${d.actividades}</p></div>
        <div class="panel"><h3>🧠 Reflexión para la clase</h3><p>${d.reflexion}</p></div>
        <div class="panel"><h3>💡 Explicación para Estudiantes</h3><p>${d.explicacion}</p></div>
        <div class="panel"><h3>📘 Contenido Teórico</h3><p>${d.teoria}</p></div>
    `;
    document.getElementById('modal').style.display = 'block';
    lucide.createIcons();
}
lucide.createIcons();
</script>
</body>
</html>
