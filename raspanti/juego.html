<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío: Áreas del Desarrollo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;600&family=Outfit:wght@400;700&display=swap');
        
        :root {
            --azul: #4EA8DE; --rosa: #FF8FAB; --verde: #70D6FF; --lila: #B59CFF; --naranja: #FFADAD;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { font-family: 'Outfit', sans-serif; margin: 0; background: #2D3436; color: #2D3436; }

        /* PANTALLA INTRO */
        #intro { 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #3D4A52 0%, #1A1F22 100%); color: white; text-align: center;
        }
        .btn-start { 
            padding: 20px 60px; font-size: 1.5rem; border-radius: 50px; border: none; cursor: pointer;
            background: var(--azul); color: white; font-weight: 700; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-start:hover { transform: scale(1.1); }

        /* DASHBOARD */
        #game { display: none; padding: 40px; background: #F0F4F8; min-height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1100px; margin: auto; }
        .card { 
            height: 250px; border-radius: 40px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; cursor: pointer; transition: 0.4s; color: white; font-size: 1.5rem; font-weight: 700;
        }

        /* MODAL Y FICHAS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; padding: 40px; overflow-y: auto; }
        .ficha { background: var(--glass); max-width: 800px; margin: auto; padding: 40px; border-radius: 50px; position: relative; }
        .accordion { 
            background: white; margin: 15px 0; padding: 20px; border-radius: 20px; 
            cursor: pointer; border-left: 10px solid var(--azul); box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .panel { display: none; padding: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div id="intro">
    <h1 style="font-size: 4rem; margin-bottom: 20px;">Propuesta Experiencial</h1>
    <p style="font-size: 1.5rem; margin-bottom: 40px;">¿Estás lista para poner a prueba tus sentidos?</p>
    <button class="btn-start" onclick="document.getElementById('intro').style.display='none'; document.getElementById('game').style.display='block';">Comenzar Misión</button>
</div>

<div id="game">
    <h1 style="text-align:center; margin-bottom: 40px;">Selecciona tu Estación</h1>
    <div class="grid">
        <div class="card" style="background:var(--azul)" onclick="abrir(0)">🗣️ Comunicación</div>
        <div class="card" style="background:var(--rosa)" onclick="abrir(1)">🧠 Memoria</div>
        <div class="card" style="background:var(--verde)" onclick="abrir(2)">🧩 Ejecutivas</div>
        <div class="card" style="background:var(--lila)" onclick="abrir(3)">🔍 Cognitiva</div>
        <div class="card" style="background:var(--naranja)" onclick="abrir(4)">🤲 Psicomotora</div>
    </div>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="ficha" onclick="event.stopPropagation()" id="content"></div>
</div>

<script>
const data = [
    { t: "Estación 1: Comunicación y Lenguaje", d: "ACTIVIDADES COMPLETAS:<br>1. Armar un avión de papel usando solo gestos, dibujos o sílabas sin sentido.<br>2. Explicar cómo atarse los cordones sin palabras ni señas obvias.<br>3. Pedir una goma de borrar sin hablar, sin señalar ni escribir.", r: "PREGUNTAS DE REFLEXIÓN:<br>¿Qué pasó cuando no podías usar las palabras?<br>¿Qué sentiste cuando no entendías qué quería decir tu compañera?<br><br>EXPLICACIÓN A ESTUDIANTES:<br>Las personas con DI muchas veces entienden mejor con apoyos visuales, gestos, pictogramas o lenguaje simple. Otras veces, pueden no encontrar las palabras para expresarse. Por eso es clave acompañarlas con paciencia, estrategias visuales y sin subestimarlas.", th: "CONTENIDO TEÓRICO:<br>El lenguaje expresivo es la capacidad de comunicar pensamientos, necesidades o emociones. El lenguaje comprensivo es la capacidad de entender lo que los demás dicen. En personas con discapacidad intelectual (DI), estas funciones pueden estar afectadas. Esto no implica que no tengan ideas, sino que la forma de expresarlas o comprenderlas puede estar alterada." },
    /* (Sigue la misma estructura para las 5 estaciones con todo el texto original) */
];

function abrir(i) {
    const d = data[i];
    document.getElementById('content').innerHTML = `
        <h1 style="text-align:center">${d.t}</h1>
        <div class="accordion" onclick="toggle('d${i}')">🔹 DESAFÍO A REALIZAR (Haz clic aquí)</div>
        <div id="d${i}" class="panel" style="display:block">${d.d}</div>
        <div class="accordion" onclick="toggle('r${i}')">🧠 REFLEXIÓN Y EXPLICACIÓN</div>
        <div id="r${i}" class="panel">${d.r}</div>
        <div class="accordion" onclick="toggle('th${i}')">📘 CONTENIDO TEÓRICO</div>
        <div id="th${i}" class="panel">${d.th}</div>
    `;
    document.getElementById('modal').style.display = 'block';
}

function toggle(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
</script>
</body>
</html>
