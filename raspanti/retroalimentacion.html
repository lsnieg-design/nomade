<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Retroalimentación</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .contenedor { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel-controles { width: 35%; background: white; padding: 20px; border-radius: 8px; }
        .panel-reporte { width: 65%; background: white; padding: 40px; }
        
        /* Esto hace que el textarea dentro de la tabla parezca texto normal */
        .txt-editable { 
            width: 100%; border: 1px dashed #ccc; padding: 5px; 
            font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 50px;
        }
        
        @media print {
            .panel-controles { display: none; }
            .panel-reporte { width: 100%; box-shadow: none; padding: 0; }
            .txt-editable { border: none; } /* Sin borde al imprimir */
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="panel-controles">
        <h2>Controles</h2>
        <!-- Al cambiar el select, solo cambia el nivel, pero no debería borrar lo que escribas en la tabla -->
        <label>1. Comprensión (Seleccionar para sugerir):</label>
        <select onchange="sugerir('rub1', this.value)">
            <option value="">Selecciona una opción...</option>
            <option value="Excelente (3p)">Excelente (3p)</option>
            <option value="Bueno (2.25p)">Bueno (2.25p)</option>
        </select>
        <hr>
        <button onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <div class="panel-reporte">
        <h1>Retroalimentación</h1>
        <table>
            <tr>
                <th>Criterio</th>
                <th>Nivel</th>
                <th>Descripción (Edita aquí libremente)</th>
            </tr>
            <tr>
                <td>Comprensión Teórica</td>
                <td id="rub1-nivel">---</td>
                <td><textarea id="rub1-desc" class="txt-editable">Aquí puedes escribir tu texto personalizado. Nada se borrará aunque cambies el menú.</textarea></td>
            </tr>
        </table>
    </div>
</div>

<script>
    // Tu base de datos de sugerencias
    const baseSugerencias = {
        "rub1": {
            "Excelente (3p)": "Articula conceptos con autores de forma precisa y profunda.",
            "Bueno (2.25p)": "Menciona autores adecuadamente."
        }
    };

    function sugerir(id, valor) {
        if(valor === "") return;
        
        // Cambia el nivel
        document.getElementById(id + '-nivel').innerText = valor;
        
        // Cambia la descripción SOLO si quieres, pero ahora está en un textarea
        // que tú puedes editar después sin que esto lo borre.
        document.getElementById(id + '-desc').value = baseSugerencias[id][valor];
    }
</script>

</body>
</html>
