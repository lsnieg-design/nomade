<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Retroalimentación | Lic. Lucía Snieg</title>
    <style>
        /* --- TUS ESTILOS ORIGINALES --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .contenedor { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .panel-controles { width: 35%; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: fit-content; }
        h2 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; background-color: #2980b9; color: white; padding: 15px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .panel-reporte { width: 65%; background: white; padding: 40px 50px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header-institucional { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #2c3e50; padding-bottom: 15px; margin-bottom: 25px; }
        .logo-placeholder { max-width: 120px; max-height: 80px; object-fit: contain; }
        .datos-alumno { background-color: #f8f9fa; padding: 15px; border-left: 4px solid #2980b9; margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.8rem; }
        th { background-color: #f4f6f7; }
        
        .observaciones-box { font-style: italic; color: #444; margin-bottom: 25px; white-space: pre-wrap; }
        .firma-box { width: 40%; margin-left: auto; text-align: center; }
        .img-firma-sello { height: 80px; object-fit: contain; }
        
        @media print { .panel-controles { display: none; } .panel-reporte { width: 100%; box-shadow: none; padding: 0; margin: 0; } }
    </style>
</head>
<body onload="actualizarPrevio()">

<div class="contenedor">
    <div class="panel-controles">
        <h2>Cargar Datos</h2>
        <div class="form-group"><label>Nombre:</label><input type="text" id="inNombre" oninput="actualizarPrevio()"></div>
        <div class="form-group"><label>Apellido:</label><input type="text" id="inApellido" oninput="actualizarPrevio()"></div>
        <div id="selectores-container"></div>
        <div class="form-group"><label>Observaciones:</label><textarea id="inObs" oninput="actualizarPrevio()"></textarea></div>
        <div class="form-group"><label>Nota Final:</label><input type="text" id="inNota" oninput="actualizarPrevio()"></div>
        <button onclick="window.print()">🖨️ Generar PDF / Imprimir</button>
    </div>

    <div class="panel-reporte">
        <div class="header-institucional">
            <img src="logo.jpg" alt="Logo" class="logo-placeholder">
            <div class="datos-encabezado"><h1>Grilla de Evaluación</h1></div>
        </div>
        <div class="datos-alumno"><strong>Estudiante:</strong> <span id="outNombre">---</span> <span id="outApellido"></span></div>
        
        <table>
            <thead><tr><th>Criterio</th><th>Nivel</th><th>Descripción</th></tr></thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>

        <div class="observaciones-box" id="outObs"></div>
        <div class="nota-final" style="text-align:right; font-weight:bold;">Calificación: <span id="outNota">---</span></div>
        
        <div class="firma-box">
            <img src="firma.png" class="img-firma-sello">
            <div class="linea-firma" style="border-top:1px solid #333;"><strong>Lic. Prof. Lucía Snieg</strong></div>
        </div>
    </div>
</div>

<script>
    // La data exacta de image_eacaab.jpg
    const rubrica = {
        "Articulación Teórica (3.5p)": {
            "Excelente": "Integra y profundiza con precisión las tesis de al menos 3 autores. Uso impecable de conceptos. (3.5p)",
            "Bueno": "Menciona autores adecuadamente, relacionándolos de forma clara pero con menor desarrollo analítico. (2.5p)",
            "Suficiente": "Uso de autores de forma fragmentada, enumerativa o superficial. (1.5p)",
            "Insuficiente": "Ausencia de fundamentación conceptual o errores disciplinares graves. (0.5p)"
        },
        "Creatividad y Formato (3.5p)": {
            "Excelente": "Uso original y humorístico del formato 'Llame ya'. El video tiene gran dinamismo y apropiación. (3.5p)",
            "Bueno": "El spot es claro, prolijo y entretenido. Cumple estéticamente con la parodia requerida. (2.5p)",
            "Suficiente": "Spot plano o lineal. Escaso uso de recursos expresivos o del humor publicitario. (1.5p)",
            "Insuficiente": "No logra estructurar el formato audiovisual pedido o copia ideas directas. (0.5p)"
        },
        "Trabajo Colaborativo (2p)": {
            "Excelente": "Coherencia interna absoluta entre el escrito y el spot. Presencia equilibrada de lxs integrantes. (2p)",
            "Bueno": "Propuesta integrada con buena organización general, aunque con roles desiguales en el video. (1.5p)",
            "Suficiente": "Falta de hilo conductor evidente entre el video y la fundamentación del PDF. (1p)",
            "Insuficiente": "Se evidencia una yuxtaposición de partes individuales sin armado colectivo. (0.5p)"
        },
        "Tiempo y Forma (1p)": {
            "Excelente": "Entrega formal puntual en la fecha asignada. PDF perfectamente estructurado y link activo. (1p)",
            "Bueno": "Entrega en fecha. Detalles menores en la titulación del archivo o formato de citas. (0.75p)",
            "Suficiente": "Entrega fuera de término (con aviso previo institucional) o errores de prolijidad. (0.5p)",
            "Insuficiente": "Entrega muy tardía, desorganizada o sin acceso a los links de Drive. (0.25p)"
        }
    };

    function init() {
        const cont = document.getElementById('selectores-container');
        const cuerpo = document.getElementById('cuerpo-tabla');
        Object.keys(rubrica).forEach((cat, i) => {
            cont.innerHTML += `<label>${cat}:</label><select id="s-${i}" onchange="actualizarPrevio()">${Object.keys(rubrica[cat]).map(n => `<option value="${n}">${n}</option>`).join('')}</select>`;
            cuerpo.innerHTML += `<tr><td><strong>${cat}</strong></td><td id="n-${i}"></td><td id="d-${i}"></td></tr>`;
        });
    }

    function actualizarPrevio() {
        document.getElementById('outNombre').innerText = document.getElementById('inNombre').value;
        document.getElementById('outApellido').innerText = document.getElementById('inApellido').value;
        document.getElementById('outObs').innerText = document.getElementById('inObs').value;
        document.getElementById('outNota').innerText = document.getElementById('inNota').value;
        Object.keys(rubrica).forEach((cat, i) => {
            let val = document.getElementById('s-'+i).value;
            document.getElementById('n-'+i).innerText = val;
            document.getElementById('d-'+i).innerText = rubrica[cat][val];
        });
    }
    init();
</script>
</body>
</html>
