<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Retroalimentación | Lic. Lucía Snieg</title>
    <style>
        /* MANTENGO TUS ESTILOS ORIGINALES */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .contenedor { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .panel-controles { width: 40%; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel-reporte { width: 60%; background: white; padding: 40px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* Estilos de la botonera */
        .eje-control { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .botones-nivel { display: flex; gap: 5px; margin-top: 5px; }
        .btn-nivel { font-size: 0.75rem; padding: 5px; cursor: pointer; background: #e1e1e1; border: none; border-radius: 3px; }
        .btn-nivel:hover { background: #2980b9; color: white; }

        /* Estilos de tabla y reporte (Originales) */
        .logo-placeholder { max-width: 120px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; font-size: 0.9rem; }
        @media print { .panel-controles { display: none; } .panel-reporte { width: 100%; box-shadow: none; } }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="panel-controles">
        <h2>Cargar Datos</h2>
        <input type="text" id="inNombre" placeholder="Nombre Estudiante" oninput="actualizarTexto()">
        
        <hr>
        <h3>Botonera de Rúbrica</h3>
        <div id="contenedor-botones"></div>
        
        <textarea id="inObs" placeholder="Observaciones..." oninput="actualizarTexto()"></textarea>
        <button onclick="window.print()" style="width:100%; padding:10px; background:#2980b9; color:white; border:none; margin-top:10px;">🖨️ Imprimir</button>
    </div>

    <div class="panel-reporte">
        <div style="display:flex; justify-content:space-between;">
            <img src="logo.jpg" class="logo-placeholder">
            <div><h1>Retroalimentación</h1></div>
        </div>
        <p><strong>Estudiante:</strong> <span id="outNombre">---</span></p>
        <table>
            <thead><tr><th>Criterio</th><th>Descripción</th></tr></thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
        <h3>Observaciones</h3>
        <p id="outObs"></p>
    </div>
</div>

<script>
    // PEGA AQUÍ TU RÚBRICA (Título y sus 4 niveles)
    const miRubrica = {
        "Articulación Teórica": ["Integra 3 autores.", "Menciona autores.", "Fragmentado.", "Sin fundamento."],
        "Creatividad": ["Muy original.", "Claro y prolijo.", "Plano.", "No logra formato."],
        "Trabajo Colaborativo": ["Coherente.", "Organizado.", "Falta hilo.", "Yuxtapuesto."],
        "Tiempo y Forma": ["Puntual.", "En fecha.", "Fuera de término.", "Muy tardío."]
    };

    function crearInterfaz() {
        const contBotones = document.getElementById('contenedor-botones');
        const tabla = document.getElementById('cuerpo-tabla');

        for (let criterio in miRubrica) {
            // Crear Botones
            let htmlBotones = `<div class="eje-control"><strong>${criterio}</strong><div class="botones-nivel">`;
            miRubrica[criterio].forEach(texto => {
                htmlBotones += `<button class="btn-nivel" onclick="enviar('${criterio}', '${texto}')">${texto.substring(0,10)}...</button>`;
            });
            contBotones.innerHTML += htmlBotones + `</div></div>`;

            // Crear Fila en tabla
            tabla.innerHTML += `<tr id="fila-${criterio}"><td>${criterio}</td><td id="desc-${criterio}">---</td></tr>`;
        }
    }

    function enviar(criterio, texto) {
        document.getElementById('desc-' + criterio).innerText = texto;
    }

    function actualizarTexto() {
        document.getElementById('outNombre').innerText = document.getElementById('inNombre').value;
        document.getElementById('outObs').innerText = document.getElementById('inObs').value;
    }

    crearInterfaz();
</script>
</body>
</html>
