<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador Universal de Retroalimentación</title>

<style>
body{
    font-family:Segoe UI,sans-serif;
    background:#f4f6f8;
    margin:20px;
}

.contenedor{
    display:flex;
    gap:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

#config{
    width:40%;
}

#reporte{
    width:60%;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#f0f2f5;
}

input,textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.btn-agregar{
    margin-top:10px;
    width:100%;
    padding:10px;
}

.boton-nivel{
    margin:3px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#dfe6e9;
}

.boton-nivel.activo{
    background:#3498db;
    color:white;
}

.criterio-box{
    margin-bottom:20px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.nota{
    font-size:24px;
    font-weight:bold;
    text-align:right;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="contenedor">

<div class="panel" id="config">

<h2>Configurar Rúbrica</h2>

<table id="tablaRubrica">
<thead>
<tr>
<th>Criterio</th>
<th>Nivel</th>
<th>Puntaje</th>
<th>Descripción</th>
</tr>
</thead>

<tbody>

<tr>
<td><input value="Comprensión Teórica"></td>
<td><input value="Excelente"></td>
<td><input value="3"></td>
<td><input value="Articula conceptos con autores de forma precisa y profunda"></td>
</tr>

<tr>
<td><input value="Comprensión Teórica"></td>
<td><input value="Bueno"></td>
<td><input value="2.25"></td>
<td><input value="Menciona autores adecuadamente"></td>
</tr>

<tr>
<td><input value="Comprensión Teórica"></td>
<td><input value="Suficiente"></td>
<td><input value="1.5"></td>
<td><input value="Menciona autores superficialmente"></td>
</tr>

<tr>
<td><input value="Comprensión Teórica"></td>
<td><input value="Insuficiente"></td>
<td><input value="0.5"></td>
<td><input value="No utiliza bibliografía"></td>
</tr>

</tbody>
</table>

<button class="btn-agregar" onclick="agregarFila()">
➕ Agregar fila de rúbrica
</button>

<button class="btn-agregar" onclick="generarCorreccion()">
🚀 Generar Formulario de Corrección
</button>

<hr>

<h3>Datos del estudiante</h3>

<input id="nombre" placeholder="Nombre y apellido">

<textarea id="observaciones"
placeholder="Observaciones generales"></textarea>

</div>

<div class="panel" id="reporte">

<h2>Retroalimentación</h2>

<div id="zonaCorreccion"></div>

<hr>

<table>
<thead>
<tr>
<th>Criterio</th>
<th>Nivel</th>
<th>Puntaje</th>
<th>Descripción</th>
</tr>
</thead>

<tbody id="tablaResultado">
</tbody>
</table>

<div class="nota">
Nota Final: <span id="notaFinal">0</span>
</div>

</div>

</div>

<script>

let rubrica = {};
let seleccionados = {};

function agregarFila(){

let tabla =
document.querySelector("#tablaRubrica tbody");

let fila = document.createElement("tr");

fila.innerHTML = `
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
`;

tabla.appendChild(fila);
}

function generarCorreccion(){

rubrica = {};
seleccionados = {};

let filas =
document.querySelectorAll(
"#tablaRubrica tbody tr"
);

filas.forEach(fila=>{

let c =
fila.cells[0].querySelector("input").value;

let n =
fila.cells[1].querySelector("input").value;

let p =
parseFloat(
fila.cells[2].querySelector("input").value
);

let d =
fila.cells[3].querySelector("input").value;

if(!rubrica[c]){
rubrica[c]=[];
}

rubrica[c].push({
nivel:n,
puntaje:p,
descripcion:d
});

});

let zona =
document.getElementById("zonaCorreccion");

zona.innerHTML="";

for(let criterio in rubrica){

let div =
document.createElement("div");

div.className="criterio-box";

div.innerHTML=
`<strong>${criterio}</strong><br>`;

rubrica[criterio].forEach(item=>{

let boton =
document.createElement("button");

boton.className="boton-nivel";

boton.innerText=item.nivel;

boton.onclick=()=>{

seleccionar(
criterio,
item,
boton
);

};

div.appendChild(boton);

});

zona.appendChild(div);

}

actualizarTabla();
}

function seleccionar(
criterio,
item,
boton
){

seleccionados[criterio]=item;

let contenedor =
boton.parentElement;

contenedor
.querySelectorAll(".boton-nivel")
.forEach(b=>b.classList.remove("activo"));

boton.classList.add("activo");

actualizarTabla();
}

function actualizarTabla(){

let tabla =
document.getElementById(
"tablaResultado"
);

tabla.innerHTML="";

let total=0;

for(let criterio in seleccionados){

let item =
seleccionados[criterio];

total += item.puntaje;

tabla.innerHTML += `
<tr>
<td>${criterio}</td>
<td>${item.nivel}</td>
<td>${item.puntaje}</td>
<td>${item.descripcion}</td>
</tr>
`;

}

document.getElementById(
"notaFinal"
).innerText =
total.toFixed(2);

}

generarCorreccion();

</script>

</body>
</html>
