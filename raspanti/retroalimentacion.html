<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Retroalimentación | Lucía Snieg</title>
    <!-- (Mantén tus mismos estilos CSS aquí) -->
    <style>
        /* ... (Usa el mismo CSS que ya tenías para mantener el diseño) ... */
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .contenedor { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .panel-controles { width: 35%; background: white; padding: 25px; border-radius: 10px; }
        .panel-reporte { width: 65%; background: white; padding: 40px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        @media print { .panel-controles { display: none; } .panel-reporte { width: 100%; box-shadow: none; } }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="panel-controles">
        <h2>Configurar Evaluación</h2>
        <div id="controles-rubrica"></div> <!-- Aquí se inyectarán los selectores -->
    </div>

    <div class="panel-reporte">
        <h1>Rúbrica de Evaluación</h1>
        <table>
            <thead><tr><th>Criterio</th><th>Descripción</th></tr></thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </div>
</div>

<script>
    // --- EDITA TUS CRITERIOS Y NIVELES AQUÍ ---
    const rubricaData = {
        "Articulación Teórica": {
            "Excelente": "Integra y profundiza con precisión las tesis de al menos 3 autores. Uso impecable de conceptos.",
            "Bueno": "Menciona autores adecuadamente, relacionándolos de forma clara pero con menor desarrollo analítico.",
            "Suficiente": "Uso de autores de forma fragmentada, enumerativa o superficial.",
            "Insuficiente": "Ausencia de fundamentación conceptual o errores disciplinares graves."
        },
        "Creatividad y Formato": {
            "Excelente": "Uso original y humorístico del formato 'Llame ya'. Gran dinamismo.",
            "Bueno": "El spot es claro, prolijo y entretenido.",
            "Suficiente": "Spot plano o lineal. Escaso uso de recursos expresivos.",
            "Insuficiente": "No logra estructurar el formato audiovisual pedido."
        }
        // Puedes agregar más criterios aquí siguiendo la misma estructura
    };

    function renderizar() {
        const controles = document.getElementById('controles-rubrica');
        const cuerpo = document.getElementById('cuerpo-tabla');

        for (let criterio in rubricaData) {
            // Crear Selectores
            controles.innerHTML += `<label>${criterio}</label><select id="sel-${criterio}" onchange="actualizar()">
                ${Object.keys(rubricaData[criterio]).map(niv => `<option value="${niv}">${niv}</option>`).join('')}
            </select>`;

            // Crear Filas
            cuerpo.innerHTML += `<tr><td><strong>${criterio}</strong></td><td id="desc-${criterio}">${Object.values(rubricaData[criterio])[0]}</td></tr>`;
        }
    }

    function actualizar() {
        for (let criterio in rubricaData) {
            let nivelElegido = document.getElementById(`sel-${criterio}`).value;
            document.getElementById(`desc-${criterio}`).innerText = rubricaData[criterio][nivelElegido];
        }
    }

    window.onload = renderizar;
</script>
</body>
</html>
