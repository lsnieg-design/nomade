<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Retroalimentación | Lucía Snieg</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .contenedor { display: flex; gap: 20px; max-width: 1200px; margin: auto; }
        .panel-controles { width: 30%; background: white; padding: 20px; border-radius: 8px; }
        .panel-reporte { width: 70%; background: white; padding: 40px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        select, input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; font-size: 0.9rem; }
        [contenteditable="true"] { background: #fffdf0; border: 1px dashed #d4ac0d; }
        @media print { .panel-controles { display: none; } .panel-reporte { width: 100%; box-shadow: none; } }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="panel-controles">
        <h3>Configuración</h3>
        <input type="text" id="inNombre" placeholder="Nombre Estudiante" oninput="actualizar()">
        <div id="selectores-container"></div>
        <button onclick="window.print()">🖨️ Imprimir PDF</button>
    </div>

    <div class="panel-reporte">
        <h2 id="outNombre">Estudiante: ---</h2>
        <table id="tabla-rubrica">
            <thead><tr><th>Eje</th><th>Nivel</th><th>Descripción (Editable)</th></tr></thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </div>
</div>

<script>
    // --- AQUÍ CONFIGURAS TUS 5 EJES Y SUS 4 NIVELES ---
    const configEjes = [
        { nombre: "Eje 1: Comprensión", niveles: {"Excelente": "Muy bien", "Bueno": "Bien", "Suficiente": "Regular", "Insuficiente": "Insuficiente"} },
        { nombre: "Eje 2: Creatividad", niveles: {"Excelente": "Muy bien", "Bueno": "Bien", "Suficiente": "Regular", "Insuficiente": "Insuficiente"} },
        { nombre: "Eje 3: Reflexión", niveles: {"Excelente": "Muy bien", "Bueno": "Bien", "Suficiente": "Regular", "Insuficiente": "Insuficiente"} },
        { nombre: "Eje 4: Producción", niveles: {"Excelente": "Muy bien", "Bueno": "Bien", "Suficiente": "Regular", "Insuficiente": "Insuficiente"} },
        { nombre: "Eje 5: Conducta", niveles: {"Excelente": "Muy bien", "Bueno": "Bien", "Suficiente": "Regular", "Insuficiente": "Insuficiente"} }
    ];

    function inicializar() {
        const container = document.getElementById('selectores-container');
        const tbody = document.getElementById('cuerpo-tabla');

        configEjes.forEach((eje, i) => {
            // Crear Selects en panel control
            let select = `<label>${eje.nombre}</label><select id="sel-${i}" onchange="actualizar()">`;
            for (let niv in eje.niveles) select += `<option value="${niv}">${niv}</option>`;
            container.innerHTML += select + `</select>`;

            // Crear Filas en tabla
            tbody.innerHTML += `<tr>
                <td><strong>${eje.nombre}</strong></td>
                <td id="niv-${i}">Excelente</td>
                <td id="desc-${i}" contenteditable="true"></td>
            </tr>`;
        });
        actualizar();
    }

    function actualizar() {
        document.getElementById('outNombre').innerText = "Estudiante: " + (document.getElementById('inNombre').value || "---");
        configEjes.forEach((eje, i) => {
            let val = document.getElementById('sel-' + i).value;
            document.getElementById('niv-' + i).innerText = val;
            document.getElementById('desc-' + i).innerText = eje.niveles[val];
        });
    }

    window.onload = inicializar;
</script>
</body>
</html>
