<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concepciones de Enseñanza - Cuestionario Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #F5F5DC;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(245, 245, 220, 0.3);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #F5F5DC;
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        .content {
            padding: 40px;
        }

        .login-box {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
            font-size: 1em;
            outline: none;
        }
        .login-box input:focus {
            border-color: #722F37;
        }
        
        .question-card {
            background: #FAEBD7;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #722F37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        
        .question-number {
            color: #722F37;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        .scenario {
            font-size: 1.1em;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #2d3748;
            background: #F5F5DC;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
        }
        
        .options {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option {
            background: #F5F5DC;
            border: 2px solid #D2B48C;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .option:hover {
            border-color: #722F37;
            background: #FAEBD7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(114, 47, 55, 0.2);
        }
        
        .option.selected {
            border-color: #722F37;
            background: #FAEBD7;
        }
        
        .option.correct {
            border-color: #8B4513;
            background: #DEB887;
        }
        
        .option.incorrect {
            border-color: #A0522D;
            background: #F4A460;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1em;
            line-height: 1.6;
            display: none;
        }
        
        .feedback.correct {
            background: #DEB887;
            border: 1px solid #8B4513;
            color: #2d3748;
        }
        
        .feedback.incorrect {
            background: #F4A460;
            border: 1px solid #A0522D;
            color: #2d3748;
        }
        
        .btn {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(114, 47, 55, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        
        .score {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
        }
        
        .hidden {
            display: none;
        }
        
        .final-score {
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .container { margin: 10px; border-radius: 15px; }
            .content { padding: 20px; }
            .header h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div class="container" id="login-container">
        <div class="header">
            <h1>Cuestionario Interactivo</h1>
            <p>Por favor, ingresá tus datos para comenzar</p>
        </div>
        <div class="content login-box">
            <input type="text" id="nombreInput" placeholder="Nombre" required>
            <input type="text" id="apellidoInput" placeholder="Apellido" required>
            <button class="btn" onclick="iniciarCuestionario()">Ingresar al Desafío</button>
        </div>
    </div>

    <div class="container hidden" id="game-container">
        <div class="header">
            <h1>Concepciones de Enseñanza</h1>
            <p>Identificá qué concepción se refleja en cada escena educativa</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="content" id="content"></div>
        
        <div class="navigation">
            <div class="score" id="score">Pregunta 1 de 10</div>
            <div>
                <button class="btn" id="prevBtn" onclick="previousQuestion()" disabled>Anterior</button>
                <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Siguiente</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDR97w2w-_zeRWAn8vZv7kXO6cr8AUiAxcv-EHTqXcaHjL9ANrWv_VcrWILyTSZtfg/exec";

        const questions = [
            {
                scenario: "Durante la clase de Historia, la profesora María explica detalladamente los eventos de la Revolución Francesa. Los estudiantes permanecen en silencio, tomando apuntes mientras ella presenta una secuencia cronológica de hechos. Al final, asigna páginas del libro para memorizar fechas y nombres importantes para el examen de la próxima semana.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Exacto [NOMBRE]! Has identificado perfectamente esta concepción. En esta escena observamos los elementos clásicos de la enseñanza como transmisión: la docente es la única fuente de saber, los estudiantes son receptores pasivos, y se privilegia la memorización.",
                incorrectFeedback: "[NOMBRE], te invito a reflexionar un poco más... ¿Notaste cómo los estudiantes se mantienen en silencio y solo toman apuntes? Inténtalo de nuevo teniendo en cuenta que aquí hay una clara jerarquía de transmisión pasiva."
            },
            {
                scenario: "En la clase de Ciencias Naturales, el profesor Carlos presenta a los estudiantes el siguiente desafío: 'Imaginen que son científicos y deben investigar por qué las plantas de nuestro jardín escolar se están marchitando.' Los estudiantes forman equipos, formulan hipótesis, diseñan experimentos y buscan información en diversas fuentes.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Identificaste correctamente la construcción activa del aprendizaje. Aquí vemos cómo los estudiantes son protagonistas de su proceso de aprendizaje: formulan hipótesis, investigan y experimentan.",
                incorrectFeedback: "Observá más detenidamente [NOMBRE], ¿cómo es el rol de los estudiantes? ¿Están participando activamente? Inténtalo de nuevo considerando que aquí los alumnos construyen su propio conocimiento."
            },
            {
                scenario: "La profesora Ana está enseñando matemáticas y dice: 'Hoy aprenderán la fórmula para calcular el área del triángulo. Es base por altura dividido dos. Ahora copien esta fórmula en sus cuadernos y resuelvan los 20 ejercicios de la página 45.'",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto [NOMBRE]! Esta es una escena típica de transmisión de conocimientos. La profesora presenta la fórmula como algo dado y los estudiantes la aplican mecánicamente sin cuestionarse el porqué.",
                incorrectFeedback: "Piensa en esto, [NOMBRE]: ¿los estudiantes descubren la fórmula o se les da hecha? Inténtalo de nuevo recordando que en este caso el conocimiento se presenta como algo acabado para ser memorizado."
            },
            {
                scenario: "En una clase de Lengua, los estudiantes de 5° grado están trabajando en un proyecto: crear una revista escolar sobre su comunidad. Deben investigar, entrevistar vecinos, escribir artículos, diseñar y trabajar en equipo para presentar su producto final.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente [NOMBRE]! Has reconocido el enfoque de desarrollo de competencias. Los estudiantes integran habilidades: investigación, comunicación, trabajo colaborativo y creatividad para resolver un problema real.",
                incorrectFeedback: "Fijate bien en todo lo que están aprendiendo, [NOMBRE]... ¿Solo es lengua o hay algo más amplio? Inténtalo de nuevo pensando en las múltiples habilidades para la vida que se integran aquí."
            },
            {
                scenario: "Durante una clase de Filosofía, el profesor presenta la pregunta: '¿Qué es la justicia?' En lugar de dar una definición, invita a los estudiantes a compartir sus ideas previas y debatir diferentes perspectivas en grupos.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Esta es construcción activa en su máxima expresión. Los estudiantes parten de sus ideas previas, argumentan y debaten para construir colectivamente el significado de la justicia.",
                incorrectFeedback: "[NOMBRE], ¿parte el profesor de una definición acabada o invita a construir juntos? Inténtalo de nuevo considerando que el conocimiento emerge del diálogo y la reflexión."
            },
            {
                scenario: "En la clase de Química, la profesora proyecta diapositivas con las propiedades de los elementos químicos. Dicta definiciones que los estudiantes copian textualmente para memorizarlas para el examen.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto [NOMBRE]! Esta escena ilustra la enseñanza como transmisión. Los estudiantes son receptores pasivos que copian y memorizan sin procesamiento profundo ni aplicación práctica.",
                incorrectFeedback: "Reflexioná sobre la dinámica, [NOMBRE]... ¿Hay diálogo o construcción conjunta? Inténtalo de nuevo notando el flujo unidireccional de información."
            },
            {
                scenario: "Los estudiantes de 3° grado están aprendiendo sobre el ciclo del agua. La maestra los lleva al patio a observar el riego en un día soleado para que noten el vapor, hagan predicciones y registren observaciones.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Perfecto [NOMBRE]! Has identificado la construcción activa. Los estudiantes descubren el ciclo del agua a través de la experiencia directa y la observación guiada.",
                incorrectFeedback: "Pensá en cómo aprenden en esta situación, [NOMBRE]... ¿Reciben información directa o la construyen de la experiencia? Inténtalo de nuevo."
            },
            {
                scenario: "En un curso de Emprendimiento, los estudiantes deben crear un plan de negocio real. Investigan el mercado, desarrollan prototipos y practican presentaciones orales ante empresarios locales.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente [NOMBRE]! Es desarrollo de competencias. Integran conocimientos de múltiples áreas para resolver un desafío real, desarrollando pensamiento crítico y profesional.",
                incorrectFeedback: "Observá la complejidad de la tarea, [NOMBRE]... ¿Es solo teoría o están desarrollando habilidades para el mundo real? Inténtalo de nuevo."
            },
            {
                scenario: "En Educación Física, el profesor explica las reglas del básquetbol en el pizarrón. Los estudiantes deben estudiar un manual para un examen teórico antes de poder ir a la cancha a jugar.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Así es [NOMBRE]! Refleja la transmisión de conocimientos. Se privilegia el saber teórico memorístico sobre la experiencia práctica y vivencial del deporte.",
                incorrectFeedback: "¿Los alumnos aprenden jugando o estudiando teoría, [NOMBRE]? Inténtalo de nuevo notando que se prioriza la memorización de reglas sobre la práctica."
            },
            {
                scenario: "En Arte, los estudiantes investigan sus raíces familiares y experimentan con técnicas para expresar su identidad. La profesora hace preguntas que profundizan su autoconocimiento sin imponer un modelo.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Construcción activa personalizada. Cada alumno construye su aprendizaje desde su experiencia personal, tomando decisiones estéticas y reflexionando sobre su proceso.",
                incorrectFeedback: "Reflexioná sobre el desarrollo, [NOMBRE]... ¿Hay un modelo único a seguir o cada uno construye algo propio? Inténtalo de nuevo."
            }
        ];

        let currentQuestion = 0;
        let selectedOption = null;
        let answered = false;
        let correctAnswers = 0;
        let userData = { nombre: "", apellido: "" };

        function iniciarCuestionario() {
            const n = document.getElementById('nombreInput').value.trim();
            const a = document.getElementById('apellidoInput').value.trim();
            
            if (n === "" || a === "") {
                alert("Por favor, ingresá tus datos para comenzar.");
                return;
            }
            
            userData.nombre = n;
            userData.apellido = a;
            
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const question = questions[currentQuestion];
            const content = document.getElementById('content');
            
            const correctText = question.correctFeedback.replace(/\[NOMBRE\]/g, userData.nombre);
            const incorrectText = question.incorrectFeedback.replace(/\[NOMBRE\]/g, userData.nombre);

            content.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Pregunta ${currentQuestion + 1} de ${questions.length}</div>
                    <div class="scenario">${question.scenario}</div>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})" id="option${index}">
                                ${option}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback" data-correct="${correctText}" data-incorrect="${incorrectText}"></div>
                    <button class="btn" onclick="checkAnswer()" id="checkBtn" disabled>Verificar respuesta</button>
                </div>
            `;
            
            updateProgress();
            updateNavigation();
            selectedOption = null;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById(`option${index}`).classList.add('selected');
            selectedOption = index;
            document.getElementById('checkBtn').disabled = false;
        }

        function checkAnswer() {
            if (selectedOption === null || answered) return;
            
            const question = questions[currentQuestion];
            const feedbackElem = document.getElementById('feedback');
            const checkBtn = document.getElementById('checkBtn');
            const options = document.querySelectorAll('.option');
            
            answered = true;
            checkBtn.style.display = 'none';
            
            if (selectedOption === question.correct) {
                correctAnswers++;
                options[selectedOption].classList.add('correct');
                feedbackElem.className = 'feedback correct';
                feedbackElem.innerHTML = feedbackElem.getAttribute('data-correct');
            } else {
                options[selectedOption].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                feedbackElem.className = 'feedback incorrect';
                feedbackElem.innerHTML = feedbackElem.getAttribute('data-incorrect');
            }
            
            feedbackElem.style.display = 'block';
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showFinalResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('score').textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
        }

        function updateNavigation() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = true;
        }

        function showFinalResults() {
            const percentage = Math.round((correctAnswers / questions.length) * 100);
            let finalMsg = '';
            
            if (percentage >= 90) finalMsg = '¡Excelente trabajo! Tienes una comprensión muy sólida de las concepciones de enseñanza.';
            else if (percentage >= 70) finalMsg = '¡Muy bien! Mostrás un buen dominio del tema, seguí profundizando.';
            else if (percentage >= 50) finalMsg = '¡Genial! Captaste ideas importantes, te invito a seguir reflexionando.';
            else finalMsg = '¡Cada pregunta es una oportunidad de aprendizaje! Te animo a revisar el material e intentar nuevamente.';

            document.getElementById('content').innerHTML = `
                <div class="final-score">
                    <h2>¡Has completado la actividad, ${userData.nombre}!</h2>
                    <p style="margin-top: 15px;">Respuestas correctas: <strong>${correctAnswers} de ${questions.length}</strong></p>
                    <p>Porcentaje: <strong>${percentage}%</strong></p>
                    <p style="margin: 20px 0; font-style: italic;">${finalMsg}</p>
                    <button class="btn" onclick="location.reload()">Hacer de nuevo</button>
                </div>
            `;
            
            document.querySelector('.navigation').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';

            enviarDatosSilencioso();
        }

        function enviarDatosSilencioso() {
            const payload = {
                actividad: "Concepciones de enseñanza",
                fecha: new Date().toLocaleString(),
                nombre: userData.nombre,
                apellido: userData.apellido,
                puntaje: correctAnswers + "/" + questions.length
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        }
    </script>
</body>
</html>
