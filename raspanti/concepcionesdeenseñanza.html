<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concepciones de Enseñanza - Cuestionario Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #F5F5DC;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(245, 245, 220, 0.3);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #F5F5DC;
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        .content {
            padding: 40px;
        }

        /* Estilos Registro Inicial */
        .login-box {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
            font-size: 1em;
            outline: none;
        }
        .login-box input:focus {
            border-color: #722F37;
        }
        
        .question-card {
            background: #FAEBD7;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #722F37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        
        .question-number {
            color: #722F37;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        .scenario {
            font-size: 1.1em;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #2d3748;
            background: #F5F5DC;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #D2B48C;
        }
        
        .options {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option {
            background: #F5F5DC;
            border: 2px solid #D2B48C;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .option:hover {
            border-color: #722F37;
            background: #FAEBD7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(114, 47, 55, 0.2);
        }
        
        .option.selected {
            border-color: #722F37;
            background: #FAEBD7;
        }
        
        .option.correct {
            border-color: #8B4513;
            background: #DEB887;
        }
        
        .option.incorrect {
            border-color: #A0522D;
            background: #F4A460;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1em;
            line-height: 1.6;
            display: none;
        }
        
        .feedback.correct {
            background: #DEB887;
            border: 1px solid #8B4513;
            color: #2d3748;
        }
        
        .feedback.incorrect {
            background: #F4A460;
            border: 1px solid #A0522D;
            color: #2d3748;
        }
        
        .btn {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(114, 47, 55, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        
        .score {
            background: linear-gradient(135deg, #722F37 0%, #8B4513 100%);
            color: #F5F5DC;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
        }
        
        .hidden {
            display: none;
        }
        
        .final-score {
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .container { margin: 10px; border-radius: 15px; }
            .content { padding: 20px; }
            .header h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div class="container" id="login-container">
        <div class="header">
            <h1>Cuestionario Interactivo</h1>
            <p>Por favor, ingresa tus datos para comenzar</p>
        </div>
        <div class="content login-box">
            <input type="text" id="nombreInput" placeholder="Nombre" required>
            <input type="text" id="apellidoInput" placeholder="Apellido" required>
            <button class="btn" onclick="iniciarCuestionario()">Ingresar al Desafío</button>
        </div>
    </div>

    <div class="container hidden" id="game-container">
        <div class="header">
            <h1>Concepciones de Enseñanza</h1>
            <p>Identifica qué concepción se refleja en cada escena educativa</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="content" id="content"></div>
        
        <div class="navigation">
            <div class="score" id="score">Pregunta 1 de 10</div>
            <div>
                <button class="btn" id="prevBtn" onclick="previousQuestion()" disabled>Anterior</button>
                <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Siguiente</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwci-JsRoDjwnlYkhwZExA0R6dMLvLMG96mSqJkQP6oAHrfvZBCkNThHNmKilm00lGs/exec";

        const questions = [
            {
                scenario: "Durante la clase de Historia, la profesora María explica detalladamente los eventos de la Revolución Francesa. Los estudiantes permanecen en silencio, tomando apuntes mientras ella presenta una secuencia cronológica de hechos. Al final, asigna páginas del libro para memorizar fechas y nombres importantes para el examen de la próxima semana.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Exacto [NOMBRE]! Has identificado perfectamente esta concepción. En esta escena observamos los elementos clásicos de la enseñanza como transmisión: la docente es la única fuente de saber, los estudiantes son receptores pasivos, y se privilegia la memorización. Este enfoque puede ser efectivo para ciertos contenidos básicos, pero es importante complementarlo con estrategias más participativas.",
                incorrectFeedback: "[NOMBRE], te invito a reflexionar un poco más... ¿Notaste cómo los estudiantes se mantienen en silencio y solo toman apuntes? ¿Qué rol cumple la profesora en esta situación? Inténtalo de nuevo teniendo en cuenta que aquí hay una clara jerarquía donde una persona posee el conocimiento y la otra lo recibe de forma pasiva."
            },
            {
                scenario: "En la clase de Ciencias Naturales, el profesor Carlos presenta a los estudiantes el siguiente desafío: 'Imaginen que son científicos y deben investigar por qué las plantas de nuestro jardín escolar se están marchitando.' Los estudiantes forman equipos, formulan hipótesis, diseñan experimentos y buscan información en diversas fuentes. El profesor circula entre los grupos, hace preguntas orientadoras y los ayuda a reflexionar sobre sus descubrimientos.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Identificaste correctamente la construcción activa del aprendizaje. Aquí vemos cómo los estudiantes son protagonistas de su proceso de aprendizaje: formulan hipótesis, investigan, experimentan y reflexionan. El docente actúa como facilitador, haciendo preguntas que guían el pensamiento sin dar respuestas directas. Este enfoque favorece el desarrollo del pensamiento científico y la autonomía.",
                incorrectFeedback: "Observa más detenidamente [NOMBRE], ¿cómo es el rol de los estudiantes? ¿Están siendo receptores pasivos o participan activamente? ¿Qué hace el profesor: transmite información directamente o guía un proceso? Inténtalo de nuevo considerando que aquí los estudiantes construyen su propio conocimiento a través de la investigación y la reflexión."
            },
            {
                scenario: "La profesora Ana está enseñando matemáticas y dice: 'Hoy aprenderán la fórmula para calcular el área del triángulo. Es base por altura dividido dos. Ahora copien esta fórmula en sus cuadernos y resuelvan los 20 ejercicios de la página 45. Mañana haremos un quiz sobre esta fórmula.' Los estudiantes copian mecánicamente y comienzan a resolver los ejercicios aplicando la fórmula de manera repetitiva.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto [NOMBRE]! Esta es una escena típica de transmisión de conocimientos. La profesora presenta la fórmula como algo dado, los estudiantes la memorizan y la aplican mecánicamente sin cuestionarse el porqué. No hay espacio para la exploración, la comprensión profunda o la conexión con situaciones reales. Aunque este método puede ser útil para automatizar procedimientos, es importante complementarlo con comprensión conceptual.",
                incorrectFeedback: "Piensa en esto, [NOMBRE]: ¿cómo se presenta el conocimiento aquí? ¿Los estudiantes descubren la fórmula o se les da hecha? ¿Hay espacio para el cuestionamiento o la exploración? Inténtalo de nuevo recordando que en este caso el conocimiento se presenta como algo acabado que debe ser memorizado y aplicado sin mayor reflexión."
            },
            {
                scenario: "En una clase de Lengua, los estudiantes de 5° grado están trabajando en un proyecto: crear una revista escolar sobre su comunidad. Deben investigar, entrevistar vecinos, escribir artículos, diseñar, trabajar en equipo y presentar su producto final. La docente los acompaña, sugiere fuentes, ayuda a resolver conflictos grupales y evalúa tanto el proceso como el resultado, considerando creatividad, colaboración y comunicación efectiva.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente [NOMBRE]! Has reconocido el enfoque de desarrollo de competencias. En esta escena los estudiantes no solo aprenden contenidos de lengua, sino que desarrollan habilidades integrales: investigación, comunicación, trabajo colaborativo, creatividad y resolución de problemas. El proyecto conecta el aprendizaje con la realidad y la docente evalúa competencias transversales, no solo conocimientos específicos.",
                incorrectFeedback: "Fíjate bien en todo lo que están aprendiendo los estudiantes, [NOMBRE]... ¿Solo es lengua o hay algo más? ¿Qué habilidades están desarrollando más allá del contenido curricular? Inténtalo de nuevo pensando que aquí se integran múltiples competencias para la vida: trabajo en equipo, investigación, comunicación y conexión con la realidad."
            },
            {
                scenario: "Durante una clase de Filosofía, el profesor presenta la pregunta: '¿Qué es la justicia?' En lugar de dar una definición, invita a los estudiantes a compartir sus ideas previas. Luego, introduce un dilema ético y divide la clase en grupos para que debatan diferentes perspectivas. Cada grupo debe argumentar su posición y escuchar a los demás. Al final, reflexionan juntos sobre cómo evolucionaron sus ideas durante la discusión.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Esta es construcción activa del aprendizaje en su máxima expresión. Los estudiantes parten de sus ideas previas, las confrontan con las de otros, argumentan, debaten y reflexionan sobre sus propios procesos de pensamiento. El profesor facilita el diálogo y la construcción colectiva del conocimiento. No hay una 'respuesta correcta' preestablecida, sino una construcción compartida de significados.",
                incorrectFeedback: "[NOMBRE], observa cómo se construye el conocimiento aquí... ¿Parte el profesor de una definición acabada o invita a construir juntos? ¿Los estudiantes son receptores o constructores activos? Inténtalo de nuevo considerando que en esta escena el conocimiento emerge del diálogo, la reflexión y la confrontación de ideas entre todos los participantes."
            },
            {
                scenario: "En la clase de Química, la profesora proyecta diapositivas con las propiedades de los elementos químicos. Dicta definiciones que los estudiantes copian textualmente. Después explica la tabla periódica señalando cada elemento en el tablero. Los estudiantes deben memorizar los símbolos químicos y sus propiedades para el examen. No hay preguntas ni interrupciones durante la explicación.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Correcto [NOMBRE]! Esta escena ilustra perfectamente la enseñanza como transmisión de conocimientos. La profesora es la única fuente de información, los estudiantes son receptores pasivos que copian y memorizan sin procesar o cuestionar. No hay interacción, construcción o aplicación práctica. Este método puede ser útil para introducir vocabulario específico, pero limitado para desarrollar comprensión profunda.",
                incorrectFeedback: "Reflexiona sobre la dinámica de esta clase, [NOMBRE]... ¿Hay diálogo o construcción conjunta? ¿Los estudiantes participan activamente o son receptores? Inténtalo de nuevo notando que aquí predomina un flujo unidireccional de información: de la profesora hacia los estudiantes, quienes deben almacenar y reproducir lo recibido."
            },
            {
                scenario: "Los estudiantes de 3° grado están aprendiendo sobre el ciclo del agua. La maestra los lleva al patio y les propone: 'Observen qué pasa cuando riego las plantas en este día soleado.' Los niños notan que se forma vapor, hacen predicciones, experimentan con diferentes cantidades de agua y registran sus observaciones. Luego, en el aula, construyen juntos un mapa conceptual sobre lo que descubrieron y lo conectan con situaciones de su vida cotidiana.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Perfecto [NOMBRE]! Has identificado la construcción activa del aprendizaje. Los estudiantes no reciben información sobre el ciclo del agua, sino que lo descubren a través de la observación, experimentación y reflexión. Construyen su comprensión partiendo de la experiencia directa y conectándola con sus conocimientos previos. La maestra facilita el proceso de descubrimiento guiado.",
                incorrectFeedback: "Piensa en cómo aprenden los niños en esta situación, [NOMBRE]... ¿Reciben información directa o la construyen? ¿Cuál es el punto de partida del aprendizaje? Inténtalo de nuevo considerando que aquí el conocimiento surge de la experiencia directa, la observación y la reflexión compartida, no de una explicación previa."
            },
            {
                scenario: "En un curso de Emprendimiento, los estudiantes deben crear un plan de negocio real para resolver un problema de su comunidad. Trabajan en equipos multidisciplinarios, investigan el mercado, desarrollan prototipos, aprenden a usar herramientas digitales de diseño, practican presentaciones orales y gestionan un presupuesto. Al final, presentan ante un panel de empresarios locales que evalúan la viabilidad de sus propuestas.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 2,
                correctFeedback: "¡Excelente [NOMBRE]! Esta es una perfecta ilustración del desarrollo de competencias. Los estudiantes integran conocimientos de múltiples áreas (economía, tecnología, comunicación, gestión) para resolver problemas reales. Desarrollan competencias del siglo XXI: creatividad, colaboración, pensamiento crítico, comunicación y uso de tecnología. El aprendizaje trasciende el aula y se conecta directamente con la vida real.",
                incorrectFeedback: "Observa todo lo que están aprendiendo estos estudiantes, [NOMBRE]... ¿Es solo contenido teórico o algo más amplio? ¿Qué habilidades para la vida están desarrollando? Inténtalo de nuevo pensando que aquí se integran múltiples competencias transversales que los preparan para enfrentar desafíos reales y complejos en diferentes contextos."
            },
            {
                scenario: "En Educación Física, el profesor explica las reglas del básquetbol usando un diagrama en el pizarrón. Los estudiantes escuchan atentamente mientras él describe cada posición, las faltas y el sistema de puntuación. Después, deben estudiar un manual con todas las reglas para un examen teórico. La práctica deportiva se realizará solo después de aprobar el examen sobre las reglas.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 0,
                correctFeedback: "¡Así es [NOMBRE]! Aunque pueda parecer sorprendente en Educación Física, esta escena refleja claramente la transmisión de conocimientos. El profesor expone teóricamente las reglas, los estudiantes las memorizan para un examen, y la práctica se posterga. Se privilegia el conocimiento teórico sobre la experiencia práctica y la construcción de habilidades a través del juego.",
                incorrectFeedback: "¿Te resulta extraño pensar en transmisión de conocimientos en Educación Física, [NOMBRE]? Fíjate bien en la metodología... ¿Los estudiantes aprenden jugando o estudiando teoría? Inténtalo de nuevo notando que aquí se prioriza el conocimiento teórico de las reglas por sobre la experiencia práctica y vivencial del deporte."
            },
            {
                scenario: "En una clase de Arte, los estudiantes están explorando el tema 'Identidad cultural'. No hay un producto final predeterminado. Cada estudiante investiga sus raíces familiares, experimenta con diferentes técnicas artísticas, toma decisiones estéticas, documenta su proceso creativo y reflexiona sobre cómo el arte les ayuda a expresar quiénes son. La profesora acompaña individualmente a cada estudiante, haciendo preguntas que profundizan su autoconocimiento y expresión personal.",
                options: ["Transmisión de conocimientos", "Construcción activa", "Desarrollo de competencias"],
                correct: 1,
                correctFeedback: "¡Muy bien [NOMBRE]! Esta es construcción activa en su forma más personalizada. Cada estudiante construye su propio aprendizaje desde su experiencia personal, toma decisiones, experimenta y reflexiona sobre su proceso. No hay un 'resultado correcto' predefinido, sino múltiples caminos de construcción personal. La profesora actúa como acompañante del proceso de autodescubrimiento.",
                incorrectFeedback: "Reflexiona sobre cómo se desarrolla el aprendizaje aquí, [NOMBRE]... ¿Hay una técnica o contenido que todos deben aprender igual? ¿O cada estudiante construye algo único? Inténtalo de nuevo considerando que en esta escena cada estudiante es constructor de su propio conocimiento a partir de su experiencia personal, sin modelos preestablecidos que seguir."
            }
        ];

        let currentQuestion = 0;
        let selectedOption = null;
        let answered = false;
        let correctAnswers = 0;
        let userData = { nombre: "", apellido: "" };

        function iniciarCuestionario() {
            const n = document.getElementById('nombreInput').value.trim();
            const a = document.getElementById('apellidoInput').value.trim();
            
            if (n === "" || a === "") {
                alert("Por favor, ingresa tus datos para comenzar la actividad.");
                return;
            }
            
            userData.nombre = n;
            userData.apellido = a;
            
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const question = questions[currentQuestion];
            const content = document.getElementById('content');
            
            // Reemplazar [NOMBRE] en los feedbacks por el nombre real ingresado
            const correctText = question.correctFeedback.replace(/\[NOMBRE\]/g, userData.nombre);
            const incorrectText = question.incorrectFeedback.replace(/\[NOMBRE\]/g, userData.nombre);

            content.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Pregunta ${currentQuestion + 1} de ${questions.length}</div>
                    <div class="scenario">${question.scenario}</div>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})" id="option${index}">
                                ${option}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback" data-correct="${correctText}" data-incorrect="${incorrectText}"></div>
                    <button class="btn" onclick="checkAnswer()" id="checkBtn" disabled>Verificar respuesta</button>
                </div>
            `;
            
            updateProgress();
            updateNavigation();
            selectedOption = null;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById(`option${index}`).classList.add('selected');
            selectedOption = index;
            document.getElementById('checkBtn').disabled = false;
        }

        function checkAnswer() {
            if (selectedOption === null || answered) return;
            
            const question = questions[currentQuestion];
            const feedbackElem = document.getElementById('feedback');
            const checkBtn = document.getElementById('checkBtn');
            const options = document.querySelectorAll('.option');
            
            answered = true;
            checkBtn.style.display = 'none';
            
            if (selectedOption === question.correct) {
                correctAnswers++;
                options[selectedOption].classList.add('correct');
                feedbackElem.className = 'feedback correct';
                feedbackElem.innerHTML = feedbackElem.getAttribute('data-correct');
            } else {
                options[selectedOption].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                feedbackElem.className = 'feedback incorrect';
                feedbackElem.innerHTML = feedbackElem.getAttribute('data-incorrect');
            }
            
            feedbackElem.style.display = 'block';
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showFinalResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('score').textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
        }

        function updateNavigation() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = true;
        }

        function showFinalResults() {
            const percentage = Math.round((correctAnswers / questions.length) * 100);
            let finalMsg = '';
            
            if (percentage >= 90) finalMsg = '¡Excelente trabajo! Tienes una comprensión muy sólida de las concepciones de enseñanza.';
            else if (percentage >= 70) finalMsg = '¡Muy bien! Mostrás un buen dominio del tema, seguí profundizando.';
            else if (percentage >= 50) finalMsg = '¡Genial! Captaste ideas importantes, te invito a seguir reflexionando.';
            else finalMsg = '¡Cada pregunta es una oportunidad de aprendizaje! Te animo a revisar el material e intentar nuevamente.';

            document.getElementById('content').innerHTML = `
                <div class="final-score">
                    <h2>¡Has completado la actividad, ${userData.nombre}!</h2>
                    <p style="margin-top: 15px;">Respuestas correctas: <strong>${correctAnswers} de ${questions.length}</strong></p>
                    <p>Porcentaje: <strong>${percentage}%</strong></p>
                    <p style="margin: 20px 0; font-style: italic;">${finalMsg}</p>
                    <button class="btn" onclick="location.reload()">Hacer de nuevo</button>
                </div>
            `;
            
            document.querySelector('.navigation').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';

            enviarDatosSilencioso();
        }

        function enviarDatosSilencioso() {
            const payload = {
                fecha: new Date().toLocaleString(),
                nombre: userData.nombre,
                apellido: userData.apellido,
                puntaje: correctAnswers,
                total: questions.length
            };

            // Envío silencioso en segundo plano
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        }
    </script>
</body>
</html>
